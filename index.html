<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="VAM atgādņu lejupielādes lapa" />
  <title>VAM ATGĀDNES</title>

  <style>
    :root {
      --bg: #0b110d;
      --bg-soft: #121a15;
      --card: rgba(24, 35, 28, 0.88);
      --border: rgba(255, 255, 255, 0.09);
      --text: #f4f7f5;
      --muted: #a9b5ad;
      --accent: #8fa86f;
      --accent-strong: #b5ce8d;
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 20%, rgba(143, 168, 111, 0.13), transparent 32rem),
        radial-gradient(circle at 90% 80%, rgba(100, 130, 90, 0.10), transparent 30rem),
        linear-gradient(135deg, #080d0a 0%, #101812 55%, #0a100c 100%);
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.22;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, black, transparent 85%);
    }

    main {
      flex: 1;
      width: min(1100px, calc(100% - 32px));
      margin: 0 auto;
      display: grid;
      place-items: center;
      padding: 70px 0;
    }

    .panel {
      width: 100%;
      max-width: 860px;
      padding: clamp(28px, 5vw, 56px);
      border: 1px solid var(--border);
      border-radius: 28px;
      background: linear-gradient(180deg, rgba(26, 39, 31, 0.94), rgba(15, 23, 18, 0.92));
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      position: relative;
      overflow: hidden;
    }

    .panel::after {
      content: "";
      position: absolute;
      width: 240px;
      height: 240px;
      border-radius: 50%;
      right: -90px;
      top: -100px;
      background: rgba(143, 168, 111, 0.12);
      filter: blur(2px);
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--accent-strong);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      max-width: 680px;
      font-size: clamp(2.4rem, 7vw, 5.4rem);
      line-height: 0.96;
      letter-spacing: -0.055em;
    }

    .intro {
      margin: 20px 0 0;
      max-width: 620px;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.1rem);
      line-height: 1.7;
    }

    .downloads {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      margin-top: 42px;
    }

    .download-card {
      position: relative;
      min-height: 180px;
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.035);
      text-decoration: none;
      color: inherit;
      transition:
        transform 180ms ease,
        border-color 180ms ease,
        background 180ms ease,
        box-shadow 180ms ease;
      overflow: hidden;
    }

    .download-card:hover {
      transform: translateY(-5px);
      border-color: rgba(181, 206, 141, 0.45);
      background: rgba(181, 206, 141, 0.075);
      box-shadow: 0 18px 36px rgba(0, 0, 0, 0.18);
    }

    .download-card:focus-visible {
      outline: 3px solid rgba(181, 206, 141, 0.55);
      outline-offset: 4px;
    }

    .icon {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: rgba(181, 206, 141, 0.12);
      color: var(--accent-strong);
      font-size: 1.35rem;
      margin-bottom: 28px;
    }

    .download-card h2 {
      margin: 0;
      font-size: 1.05rem;
      line-height: 1.35;
    }

    .download-card span {
      display: inline-block;
      margin-top: 7px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .arrow {
      position: absolute;
      right: 20px;
      top: 20px;
      font-size: 1.15rem;
      color: var(--accent-strong);
      transition: transform 180ms ease;
    }

    .download-card:hover .arrow {
      transform: translate(3px, 3px);
    }

    .note {
      margin: 30px 0 0;
      padding-top: 22px;
      border-top: 1px solid var(--border);
      color: #8d9a91;
      font-size: 0.86rem;
      line-height: 1.6;
    }

    footer {
      width: min(1100px, calc(100% - 32px));
      margin: 0 auto;
      padding: 0 0 28px;
      text-align: center;
      color: #738078;
      font-size: 0.84rem;
    }

    footer strong {
      color: #aeb9b1;
      font-weight: 600;
    }

    @media (max-width: 700px) {
      main {
        padding: 28px 0;
      }

      .panel {
        border-radius: 22px;
      }

      .downloads {
        grid-template-columns: 1fr;
      }

      .download-card {
        min-height: 150px;
      }
    }
  </style>
</head>

<body>
  <main>
    <section class="panel">
      <p class="eyebrow">Lejupielādes</p>
      <h1>VAM ATGĀDNES</h1>
      <p class="intro">
        Izvēlies nepieciešamo materiālu. Fails tiks lejupielādēts.
      </p>

      <div class="downloads">
        <a
          class="download-card"
          href="files/VAM_ATGADNES_1-2_MG.pdf"
          download
        >
          <div class="icon">↓</div>
          <div class="arrow">↘</div>
          <h2>VAM ATGĀDNES 1.-2.MG.</h2>
          <span>Lejupielādēt failu</span>
        </a>

        <a
          class="download-card"
          href="files/VAM_ATGADNES.pdf"
          download
        >
          <div class="icon">↓</div>
          <div class="arrow">↘</div>
          <h2>VAM ATGĀDNES</h2>
          <span>Lejupielādēt failu</span>
        </a>
      </div>

    
    </section>
  </main>

  <footer>
    © <span id="year"></span> <strong>Jānis Eglis</strong>. Visas tiesības aizsargātas.
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
